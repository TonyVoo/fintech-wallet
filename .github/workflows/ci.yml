name: CI

on:
  push:
    branches: [main]
  pull_request:

# a new push to the same branch/PR cancels the run that is still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven # caches ~/.m2 keyed on the pom.xml files

      # `verify` runs unit tests (surefire) and integration tests (failsafe).
      # The integration tests start PostgreSQL through Testcontainers; Docker is preinstalled on ubuntu-latest.
      - name: Build and test (unit + integration)
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          retention-days: 7

  # Builds the real Docker images, starts the whole system and drives it through the gateway, the way a client would.
  docker-smoke-test:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build images and start the system
        run: docker compose --profile app up -d --build --wait --wait-timeout 600

      - name: Smoke test through the gateway
        run: ./scripts/smoke-test.sh

      - name: Show container logs
        if: failure()
        run: docker compose --profile app logs --tail=150

      - name: Stop the system
        if: always()
        run: docker compose --profile app down -v
