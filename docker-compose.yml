services:
  account-db:
    image: postgres:16-alpine
    container_name: wallet-account-db
    environment:
      POSTGRES_DB: account_db
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
    ports:
      - "5442:5432"
    volumes:
      - account-db-data:/var/lib/postgresql/data

  auth-db:
    image: postgres:16-alpine
    container_name: wallet-auth-db
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
    ports:
      - "5443:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data

  transaction-db:
    image: postgres:16-alpine
    container_name: wallet-transaction-db
    environment:
      POSTGRES_DB: transaction_db
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
    ports:
      - "5444:5432"
    volumes:
      - transaction-db-data:/var/lib/postgresql/data

  notification-db:
    image: postgres:16-alpine
    container_name: wallet-notification-db
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
    ports:
      - "5445:5432"
    volumes:
      - notification-db-data:/var/lib/postgresql/data

  # single-node Kafka in KRaft mode (no ZooKeeper); host port 9094 to avoid clashing with other local brokers
  kafka:
    image: apache/kafka:3.9.0
    container_name: wallet-kafka
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

volumes:
  account-db-data:
  auth-db-data:
  transaction-db-data:
  notification-db-data:
