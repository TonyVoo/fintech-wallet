services:
  account-db:
    image: postgres:16-alpine
    container_name: wallet-account-db
    environment:
      POSTGRES_DB: account_db
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
    ports:
      - "5442:5432"
    volumes:
      - account-db-data:/var/lib/postgresql/data

  auth-db:
    image: postgres:16-alpine
    container_name: wallet-auth-db
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
    ports:
      - "5443:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data

volumes:
  account-db-data:
  auth-db-data:
