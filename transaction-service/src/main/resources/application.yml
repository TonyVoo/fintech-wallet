server:
  port: 8093

spring:
  application:
    name: transaction-service
  datasource:
    url: jdbc:postgresql://localhost:5444/transaction_db
    username: wallet
    password: wallet
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9094
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        # fail fast when the broker is unreachable; the outbox keeps the event and retries later
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000

app:
  jwt:
    # Must match auth-service. DEV DEFAULT ONLY: override with JWT_SECRET in any real environment.
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LXBsZWFzZS1jaGFuZ2UtaW4tcHJvZC0wMTIzNDU2Nzg5}
    issuer: fintech-wallet-auth
  accounts:
    base-url: http://localhost:8091
    # Must match account-service. DEV DEFAULT ONLY: override with INTERNAL_API_KEY.
    api-key: ${INTERNAL_API_KEY:dev-internal-key-change-me}
    connect-timeout: 2s
    read-timeout: 5s
  recovery:
    enabled: true
    interval-ms: 15000
    # a transfer untouched for this long is considered stuck and is driven forward again
    stale-after: 30s
    batch-size: 50

  outbox:
    enabled: true
    interval-ms: 1000
    topic: transfer-events
    batch-size: 100
    send-timeout: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info
